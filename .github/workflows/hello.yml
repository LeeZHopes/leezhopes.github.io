# Lab 1：最小可运行 workflow
# 目标：理解 workflow / event / job / step / runner / action 六件套
# 文档：https://docs.github.com/actions/using-workflows/workflow-syntax-for-github-actions
name: 01 hello

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # 关键：给一个手动触发的按钮，调试时救命

# 同一分支新运行会取消旧运行，省额度也防打架
concurrency:
  group: hello-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    name: 打个招呼
    runs-on: ubuntu-latest        # 不是你的电脑，是一台干净的临时虚拟机
    steps:
      # action = 别人写好的步骤，这里把仓库代码拉到 runner 上
      - uses: actions/checkout@v5

      # 每个 step 默认在干净 shell 里执行，但共享同一个工作目录
      - name: 环境信息
        run: |
          echo "事件: ${{ github.event_name }}"
          echo "分支: ${{ github.ref }}"
          echo "提交: ${{ github.sha }}"
          node --version
          python3 --version

      - name: 一次失败会怎样
        run: |
          echo "下面这行会让整个 job 变红，后续 step 不再执行"
          # exit 1
          echo "被我注释掉了，所以现在是绿的"

  # 第二个 job 与上面默认并行；加 needs 才会串行
  second:
    name: 依赖 hello 才能跑
    needs: hello
    runs-on: ubuntu-latest
    steps:
      - run: echo "hello 绿灯之后才会执行到这里"
