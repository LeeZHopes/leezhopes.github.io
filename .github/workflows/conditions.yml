name: conditions-lab
on: [push, pull_request, workflow_dispatch]

env:
  DEBUG: "false"          # 注意：字符串，不是布尔

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 打印事实
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "是否等于 refs/heads/main => ${{ github.ref == 'refs/heads/main' }}"

      - name: env.DEBUG 直接当条件（预期：跑）
        if: env.DEBUG
        run: echo "你以为关了，其实没关"

      - name: env.DEBUG 显式比较（预期：跳过）
        if: env.DEBUG == 'true'
        run: echo "这行不会出现"

      - name: 故意失败
        run: exit 1

      - name: 失败之后默认跳过（预期：不跑）
        run: echo "不该出现"

      - name: if: always() （预期：跑）
        if: always()
        run: echo "always 生效，所以报告能上传"