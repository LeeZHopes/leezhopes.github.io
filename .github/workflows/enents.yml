name: events-lab
on: [push, pull_request, workflow_dispatch]
jobs:
  who:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "head_ref=${{ github.head_ref }}"