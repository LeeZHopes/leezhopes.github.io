# 博客 CI/CD：PR 只验证，main 验证 + 发布到 GitHub Pages
# 前置：仓库名必须是 <用户名>.github.io；Settings → Pages → Source = GitHub Actions
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR 的新提交取消旧运行（省钱）；main 上不要取消，否则一次部署可能被腰斩
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建（同时产出 Pages 制品）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 提前拦掉 Windows 生成 lockfile 时留下的"空壳条目"
      # （只有 { "optional": true }、没有 version，会让 npm ci 报 Invalid Version:）
      - name: lockfile 健康检查
        run: node scripts/check-lockfile.mjs

      - name: 安装依赖
        run: npm ci

      # 类型 / 内容 schema 检查：初期报错较多，先不阻断构建
      - name: 类型检查
        run: npm run check
        continue-on-error: true

      - name: 构建
        run: npm run build

      # ① 给 deploy job 用的 Pages 制品（tar 格式，内部不能再套一层目录）
      - name: 上传 Pages 制品
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # ② 给人看的构建产物，方便下载检查
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    # 只有 main 的 push / 手动触发才发布，PR 一律不碰生产
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # job 级 permissions 会覆盖顶层：只给部署必需的两项
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 关键：不重新构建，直接发布 build job 传过来的同一个制品
      - id: deployment
        uses: actions/deploy-pages@v5
