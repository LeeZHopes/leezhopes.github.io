# 博客 CI：每次 push / PR 都验证"能构建"
# 复制来源：ci-cd-lab/02-blog-ci.yml（含逐行讲解）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: astro check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 提前拦掉"I love you"级别的问题：lockfile 里的空壳条目（缺 version）
      # 官方 npm ci 遇到它只会甩一句 `Invalid Version:`，冒号后面还是空的，极难排查
      - name: lockfile 健康检查
        run: node scripts/check-lockfile.mjs

      - name: 安装依赖
        run: npm ci

      # 类型 / 内容 schema 检查：初期可能有较多报错，先不阻断构建
      - name: 类型检查
        run: npm run check
        continue-on-error: true

      - name: 构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7
          if-no-files-found: error
